<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat WebSockets</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Pantalla de acceso -->
    <section id="login-screen" class="screen">
      <form id="login-form" class="login-card">
        <h1>Entrar al chat</h1>
        <label for="name-input">Tu nombre</label>
        <input
          id="name-input"
          type="text"
          maxlength="20"
          placeholder="Ej: Iván"
          autocomplete="off"
          required
        />
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <!-- Pantalla de chat -->
    <section id="chat-screen" class="screen" hidden>
      <header class="chat-header">
        <h1>Chat</h1>
        <span id="conn-status" class="status status--connecting">Conectando…</span>
      </header>

      <div class="chat-body">
        <aside class="users-panel">
          <h2>Conectados</h2>
          <ul id="users-list"></ul>
        </aside>

        <main class="messages-panel">
          <ul id="messages-list" aria-live="polite"></ul>
          <p id="typing-indicator" class="typing" hidden></p>
        </main>
      </div>

      <form id="message-form" class="message-form">
        <input
          id="message-input"
          type="text"
          maxlength="500"
          placeholder="Escribe un mensaje…"
          autocomplete="off"
        />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </div>

  <script>
    // Si el backend vive en otro dominio (por ejemplo en KyraCloud),
    // pon aquí su URL wss:// completa. Si el mismo servidor sirve este
    // HTML y el WebSocket (como en local o en Render), deja "" y se
    // usa automáticamente el mismo origen.
    window.CHAT_BACKEND_URL = "wss://backend1-08846b.kyracloud.com";
  </script>
  <script src="/app.js"></script>
</body>
</html>
